kind = "web"
previewPath = "/"
title = "신문 스터디 기록"
version = "1.0.0"
id = "artifacts/news-study"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 24053

[services.development]
run = "pnpm --filter @workspace/news-study run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/news-study", "run", "build" ]
publicDir = "artifacts/news-study/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "24053"
BASE_PATH = "/"
